spring.application.name=AttendanceManagementSystem

# =========================
# Server Configuration
# =========================
server.port=8080

# =========================
# MySQL Configuration (Docker-safe)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/attendsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pradeep@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional but useful (helps avoid dialect issues in some setups)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# Spring Security (default login)
# =========================
spring.security.user.name=user
spring.security.user.password=1234

# =========================
# Logging (optional but useful for debugging)
# =========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=INFO