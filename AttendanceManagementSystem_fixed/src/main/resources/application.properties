spring.application.name=AttendanceManagementSystem

# =========================
# Server
# =========================
server.port=8080

# =========================
# MySQL Docker Configuration
# =========================
spring.datasource.url=jdbc:mysql://mysql-db:3306/attendsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect auto-detection
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# Spring Security
# =========================
spring.security.user.name=user
spring.security.user.password=1234

# =========================
# HikariCP
# =========================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2