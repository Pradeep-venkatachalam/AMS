spring.application.name=AttendanceManagementSystem

# =========================
# Server
# =========================
server.port=8080

# =========================
# MySQL (Docker-safe)
# =========================
#spring.datasource.url=jdbc:mysql://mysql-db:3306/ams_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://mysql-db:3306/ams_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.url=jdbc:mysql://localhost:3307/ams_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# Security (optional)
# =========================
spring.security.user.name=user
spring.security.user.password=1234

# =========================
# Hikari (safe production settings)
# =========================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0