<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — AttendX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="logo">
      <h1>AttendX</h1>
      <p>Sign in to your account</p>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>Role</label>
      <select id="role">
        <option value="ADMIN">Admin</option>
        <option value="TEACHER">Teacher</option>
        <option value="STUDENT">Student</option>
      </select>
    </div>

    <div style="margin-top:6px"></div>
    <button class="btn btn-primary btn-full" onclick="login()">Sign In →</button>

    <p id="msg" style="text-align:center;color:var(--danger);margin-top:14px;font-size:13px;min-height:18px"></p>

    <div class="divider"></div>
    <p style="text-align:center;font-size:13px;color:var(--text-muted)">
      No account? <a href="#" onclick="register()" style="color:var(--accent);text-decoration:none">Register</a>
    </p>
  </div>
</div>
<div id="toast"></div>
<script src="login.js"></script>
<script>
  // Pre-select role from URL param
  const params = new URLSearchParams(location.search);
  if(params.get('role')) document.getElementById('role').value = params.get('role');
</script>
</body>
</html>
